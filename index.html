<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK매직 렌탈 상품 안내</title>
<style>
  :root {
    --ink: #1d2433; --sub: #5b6475; --line: #e4e7ec; --bg: #f5f6f8;
    --brand: #e8452c; --brand-soft: #fdeeea; --navy: #22304a; --ok: #1a7f5a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; color: var(--ink); background: var(--bg); }
  a { color: inherit; text-decoration: none; }
  header { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  .top { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .logo { font-weight: 800; font-size: 19px; letter-spacing: -0.5px; }
  .lmob { display: none; }
  @media (max-width: 760px) { .lmob { display: inline; } }
  .logo b { color: var(--brand); }
  .top .call { font-size: 14px; color: var(--sub); }

  .hero { background: var(--navy); color: #fff; padding: 36px 0 32px; }
  .hero h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -0.5px; }
  .hero p { margin: 0; color: #c9d2e3; font-size: 15px; }
  .perks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .perks span { background: rgba(255,255,255,.12); border-radius: 999px; padding: 6px 12px; font-size: 13px; }

  .tabs { display: flex; gap: 8px; margin: 24px 0 16px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; cursor: pointer; }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding-bottom: 40px; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(20,30,50,.08); }
  .card .thumb { aspect-ratio: 1/1; background: #fafbfc; display: flex; align-items: center; justify-content: center; }
  .card .thumb img { width: 88%; height: 88%; object-fit: contain; }
  .card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .cat { font-size: 12px; color: var(--sub); }
  .name { font-weight: 700; font-size: 16px; line-height: 1.35; }
  .feat { font-size: 13px; color: var(--sub); }
  .price { margin-top: auto; padding-top: 8px; }
  .price del { color: #9aa1ad; font-size: 13px; margin-right: 6px; }
  .price .now { font-size: 20px; font-weight: 800; }
  .price .now small { font-size: 13px; font-weight: 600; }
  .badge { display: inline-block; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }

  /* detail */
  .back { display: inline-flex; align-items: center; gap: 8px; margin: 18px 0 14px; padding: 14px 26px; font-size: 20px; font-weight: 800; color: #fff; background: var(--navy); border-radius: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(20,30,50,.15); }
  .logo, .topcall, .navlink { white-space: nowrap; }
  @media (max-width: 760px) {
    .logo { font-size: 16px; } .logo .lsub { display: none; }
    .topcall { font-size: 13px; } .navlink { font-size: 13px; margin-left: 10px; }
  }
  .back:hover { filter: brightness(1.1); }
  .back.bottom { display: flex; justify-content: center; width: 100%; margin: 20px 0 36px; padding: 18px; font-size: 21px; }
  @media (max-width: 760px) { .back { width: 100%; justify-content: center; font-size: 20px; padding: 16px; } }
  .detail { display: grid; grid-template-columns: 1.05fr 1fr; gap: 28px; background: #fff; border-radius: 16px; border: 1px solid var(--line); padding: 24px; }
  .gallery .main { aspect-ratio: 1/1; background: #fafbfc; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .gallery .main img { width: 90%; height: 90%; object-fit: contain; }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .thumbs img { width: 64px; height: 64px; object-fit: contain; background: #fafbfc; border: 2px solid transparent; border-radius: 8px; cursor: pointer; }
  .thumbs img.on { border-color: var(--ink); }
  .info h2 { margin: 6px 0 4px; font-size: 24px; letter-spacing: -0.5px; }
  .model { color: var(--sub); font-size: 14px; }
  .opt { margin-top: 18px; }
  .opt h4 { margin: 0 0 8px; font-size: 14px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; padding: 9px 14px; border-radius: 10px; font-size: 14px; cursor: pointer; }
  .chip.on { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); font-weight: 700; }
  .chip:disabled { opacity: .4; cursor: default; }
  .csel { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; background: #fff; }
  .cardlink { font-weight: 500; font-size: 12px; color: var(--sub); text-decoration: underline; margin-left: 6px; }
  .chips.perf { margin-top: 10px; }
  .chips.perf .chip { font-size: 13px; padding: 8px 11px; }
  .cinfo { margin-top: 10px; font-size: 12.5px; color: var(--sub); line-height: 1.7; background: #fafbfc; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .cinfo b { color: var(--ink); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-right: 6px; background: #e8eefb; color: #2b55b8; }
  .tag.t-제외, .tag.t-필수, .tag.t-수수료 { background: #fdecea; color: #c63b2b; }
  .tag.t-보너스 { background: #e6f4ea; color: #1a7f37; }
  .tag.t-무이자 { background: #22304a; color: #fff; }
  .topcall { font-weight: 700; color: var(--brand); font-size: 14px; }
  .ctanote { text-align: center; font-size: 12px; color: var(--sub); margin-top: 8px; }
  .navlink { font-size: 14px; color: var(--sub); margin-left: 14px; }

  .cards h1 { font-size: 26px; margin: 4px 0 4px; }
  .cards h2 { font-size: 19px; margin: 30px 0 12px; }
  .cards h2 small { font-size: 13px; color: var(--sub); font-weight: 500; margin-left: 6px; }
  .common { background: var(--navy); color: #fff; border-radius: 14px; padding: 16px 20px; font-size: 14px; line-height: 1.8; margin-bottom: 16px; }
  .common b { color: #ffd36b; }
  .ccard { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; }
  .chead { display: flex; justify-content: space-between; align-items: flex-start; }
  .chead h3 { margin: 0 0 4px; font-size: 19px; }
  .cmeta { font-size: 13px; color: var(--sub); }
  .cbadge { background: #d9381e; color: #fff; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
  .ctiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .ctier { background: var(--bg); border-radius: 12px; padding: 12px 14px; }
  .cperf { font-size: 13px; color: var(--sub); }
  .camt { font-size: 22px; font-weight: 800; margin: 4px 0 2px; }
  .camt.hot { color: #d9381e; }
  .csub { font-size: 12px; color: var(--sub); }
  .cnotes { margin-top: 12px; font-size: 13.5px; line-height: 1.9; }
  .ccard > .cnotes:first-child { margin-top: 0; }
  @media (max-width: 760px) { .ctiers { gap: 6px; } .camt { font-size: 17px; } .ctier { padding: 10px; } }

  .pbox { margin-top: 20px; background: var(--bg); border-radius: 12px; padding: 16px 18px; }
  .prow { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; font-size: 14px; }
  .prow .v { font-weight: 700; }
  .prow.big .v { font-size: 24px; color: var(--brand); }
  .prow.total { border-top: 1px dashed #cfd4dc; margin-top: 6px; padding-top: 10px; }
  .pnote { font-size: 12px; color: var(--sub); margin-top: 6px; }

  .cta { display: block; text-align: center; margin-top: 16px; background: var(--brand); color: #fff; font-weight: 700; padding: 15px; border-radius: 12px; font-size: 16px; }
  .cta:hover { filter: brightness(.95); }

  .sec { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; margin-top: 16px; }
  .sec h3 { margin: 0 0 12px; font-size: 17px; }
  .sec ul { margin: 0; padding-left: 18px; line-height: 1.8; font-size: 14px; }
  .sec .muted { color: var(--sub); font-size: 13px; }
  .dimgs img { display: block; width: 100%; max-width: 860px; margin: 0 auto; }
  .more { display: block; text-align: center; margin-top: 12px; font-size: 14px; color: var(--sub); text-decoration: underline; }

  .card .thumb { position: relative; }
  .tline { display: flex; align-items: baseline; gap: 6px; padding: 2px 0; }
  .tterm { font-size: 11px; font-weight: 700; background: #eef0f4; color: var(--sub); border-radius: 4px; padding: 1px 6px; flex: none; }
  .tline del { color: #9aa1ad; font-size: 12px; }
  .tline .now { font-size: 17px; font-weight: 800; margin-left: auto; }
  .tline .task { margin-left: auto; font-size: 13px; color: var(--sub); }
  .pmini { font-size: 11px; color: var(--sub); text-align: right; margin-top: 2px; }

  .giftall { margin: 8px 0 44px; }
  .giftall h2 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--sub); font-size: 13px; margin: 0 0 14px; }
  .gcols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .gcol { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .ghead { color: #fff; font-weight: 700; font-size: 14px; padding: 12px 14px; }
  .glist { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; }
  .gitem { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; font: inherit; color: inherit; text-align: center; }
  button.gitem { cursor: pointer; }
  .gitem img, .gitem .noimg { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; background: #f2f3f5; }
  .gcode { display: none; } /* 사진에 A-1 등 번호가 이미 있어 숨김. 사진을 바꾸면 이 줄을 지우세요 */
  .gname { font-size: 12.5px; line-height: 1.4; }
  .gitem.on { border: 2px solid var(--brand); background: var(--brand-soft); padding: 7px; }
  .giftsec .glist { grid-template-columns: repeat(4, 1fr); padding: 0; }
  .tierpill { color: #fff; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .pick { color: var(--brand); text-decoration: underline; font-weight: 600; }
  .prow .v { text-align: right; max-width: 65%; }

  @media (max-width: 760px) {
    .gcols { grid-template-columns: 1fr; }
    .giftsec .glist { grid-template-columns: repeat(2, 1fr); }
  }

  footer { padding: 28px 0 40px; color: var(--sub); font-size: 12px; line-height: 1.7; }

  @media (max-width: 760px) {
    .detail { grid-template-columns: 1fr; padding: 16px; }
    .hero h1 { font-size: 22px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card .body { padding: 10px 12px 12px; }
    .name { font-size: 14px; }
    .price .now { font-size: 17px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <a class="logo" href="#/"><b>SK매직</b> <span class="lsub">렌탈 상품 안내</span><span class="lmob">렌탈</span></a>
    <span><span class="call" id="callInfo"></span><a class="navlink" href="#/cards">제휴카드 혜택</a></span>
  </div>
</header>
<main id="app"></main>

function cardDiscount(card, ti, m, f) {
  if (!card) return 0;
  const t = card.tiers[ti];
  if (t.minFee && f <= t.minFee) return 0;
  const d = t.base + (m <= card.extraMonths ? t.extra : 0);
  return Math.min(d, f);
}

    <div class="detail">
      <div class="gallery">
        <div class="main"><img id="mainImg" src="${img(p.gallery[0])}" alt="${p.name}"></div>
        <div class="thumbs">${p.gallery.map((g, i) => `<img src="${img(g)}" data-i="${i}" class="${i === 0 ? 'on' : ''}" alt="">`).join('')}</div>
      </div>
      <div class="info">
        <div class="cat">${p.cat}</div>
        <h2>${p.name}</h2>
        <div class="model">모델명 ${p.model} · ${p.feat}</div>

        <div class="opt"><h4>색상</h4><div class="chips" data-k="color">${p.colors.map(c => `<button class="chip" data-v="${c}">${c}</button>`).join('')}</div></div>
        <div class="opt"><h4>계약 기간</h4><div class="chips" data-k="term">${TERMS.map(c => `<button class="chip" data-v="${c}">${c}</button>`).join('')}</div></div>
        <div class="opt"><h4>관리 유형</h4><div class="chips" data-k="care">${['방문관리', '셀프관리'].map(c => `<button class="chip" data-v="${c}" ${p.care.includes(c) ? '' : 'disabled'}>${c}</button>`).join('')}</div></div>
        <div class="opt"><h4>제휴카드 할인 <a class="cardlink" href="#/cards">카드 혜택 전체 보기</a></h4>
          <select id="cardSel" class="csel">
            <option value="">선택 안 함</option>
            <optgroup label="${CARD_PROMO.title} (추가할인)">${CARDS.filter(c => c.promo).map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</optgroup>
            <optgroup label="기본할인만">${CARDS.filter(c => !c.promo).map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</optgroup>
          </select>
          <div id="perfBox"></div>
        </div>

        <div class="pbox" id="pbox"></div>
        <a class="cta" id="cta" href="${TEL}">☎ 전화로 신청하기 ${CONFIG.phone}</a>
        <div class="ctanote">통화 연결 후 위에서 고른 제품 · 조건을 말씀해 주세요.</div>
      </div>
    </div>

    <div class="sec giftsec" id="giftBox"></div>

    <div class="sec"><h3>혜택</h3><ul>${BENEFITS.map(b => `<li>${b}</li>`).join('')}</ul></div>
    <div class="sec"><h3>유의사항</h3><ul>${NOTICES.map(b => `<li>${b}</li>`).join('')}</ul></div>
    <div class="sec"><h3>상품 상세</h3>
      <div class="dimgs">${p.detail.map(d => `<img src="${img(p.ddir + d)}" alt="" loading="lazy" onerror="this.remove()">`).join('')}</div>
      <a class="more" target="_blank" rel="noopener" href="https://www.bworld.co.kr/event/rental/view.do?menu_id=B07020000&seq=${p.id}">영상 포함 전체 상세 정보 보기</a>
    </div>
    <a class="back bottom" href="#/">← 전체 상품 보기</a>
  </div>`;

  app.querySelectorAll('.thumbs img').forEach(t => t.onclick = () => {
    app.querySelectorAll('.thumbs img').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('mainImg').src = t.src;
  });
  app.querySelectorAll('.chips').forEach(g => g.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    if (c.disabled) return;
    st[g.dataset.k] = c.dataset.v; update();
  }));
  function renderGifts(pr) {
    const t = tierOf(pr.list);
    if (t === tier) return;
    tier = t; st.gift = '';
    const box = document.getElementById('giftBox');
    box.style.display = tier ? '' : 'none';
    if (!tier) return;
    box.innerHTML = `<h3>선택 사은품 <span class="tierpill" style="background:${tier.color}">${tier.code}형 · ${tier.label}</span></h3>
      <p class="muted">선택하신 조건의 정상 요금 월 ${won(pr.list)} 기준 · 아래에서 1개를 골라 주세요.</p>
      <div class="glist sel">${tier.items.map(g => giftItem(g, true)).join('')}</div>`;
    box.querySelectorAll('.gitem').forEach(b => b.onclick = () => {
      st.gift = st.gift === b.dataset.g ? '' : b.dataset.g; update();
    });
  }
  st.card = ''; st.perf = 0;
  document.getElementById('cardSel').onchange = e => { st.card = e.target.value; st.perf = 0; update(); };

  function update() {
    app.querySelectorAll('.chips').forEach(g => g.querySelectorAll('.chip').forEach(c =>
      c.classList.toggle('on', st[g.dataset.k] === c.dataset.v)));
    const pr = priceOf(p, st.term, st.care);
    const months = parseInt(st.term, 10) * 12;
    const card = CARDS.find(c => c.id === st.card);

    // 전월실적 선택 + 카드 조건
    const pb = document.getElementById('perfBox');
    if (card) {
      pb.innerHTML = `<div class="chips perf">${card.tiers.map((t, i) =>
          `<button class="chip ${i === st.perf ? 'on' : ''}" data-i="${i}">실적 ${t.perf}↑ · 월 ${won(t.base + t.extra)}</button>`).join('')}</div>
        <div class="cinfo">
          <div><b>${card.name}</b> · ARS ${card.ars} · 연회비 ${card.fee}</div>
          <div>할인 구성: 기본 ${won(card.tiers[st.perf].base)}${card.tiers[st.perf].extra ? ` + 추가 ${won(card.tiers[st.perf].extra)} (${card.extraMonths}개월)` : ''}</div>
          ${card.notes.map(n => `<div><span class="tag t-${n[0]}">${n[0]}</span>${n[1]}</div>`).join('')}
        </div>`;
      pb.querySelectorAll('.chip').forEach(b => b.onclick = () => { st.perf = +b.dataset.i; update(); });
    } else pb.innerHTML = '';

    if (!pr) {
      document.getElementById('pbox').innerHTML = `<div class="prow big"><span>${st.term} 요금</span><span class="v">상담 문의</span></div><div class="pnote">${st.term} 약정 요금은 전화 상담 시 안내해 드립니다.</div>`;
      app.querySelectorAll('.glist.sel .gitem').forEach(b => b.classList.toggle('on', b.dataset.g === st.gift));
      return;
    }
    const pm = pr.months;
    renderGifts(pr);
    document.querySelector('#giftBox .muted') && (document.querySelector('#giftBox .muted').textContent = `선택하신 조건의 정상 요금 월 ${won(pr.list)} 기준 · 아래에서 1개를 골라 주세요.`);
    // 월별 납부액 계산 후 같은 금액끼리 구간으로 묶기
    const pay = [];
    let unmet = false;
    for (let m = 1; m <= months; m++) {
      const f = pr.promo ? (m <= pm ? pr.promo : pr.after) : pr.list;
      const d = cardDiscount(card, st.perf, m, f);
      if (card && card.tiers[st.perf].minFee && f <= card.tiers[st.perf].minFee) unmet = true;
      pay.push(f - d);
    }
    const segs = [];
    pay.forEach((v, i) => {
      const s = segs[segs.length - 1];
      if (s && s.v === v) s.to = i + 1; else segs.push({ from: i + 1, to: i + 1, v });
    });
    const total = pay.reduce((a, b) => a + b, 0);

    let rows = '';
    if (pr.promo || card) rows += `<div class="prow"><span>정상 요금</span><span class="v"><del>월 ${won(pr.list)}</del></span></div>`;
    segs.forEach((s, i) => {
      const label = segs.length === 1 ? '월 렌탈료' : `${s.from}~${s.to}개월`;
      rows += `<div class="prow ${i === 0 ? 'big' : ''}"><span>${label}</span><span class="v">월 ${won(s.v)}</span></div>`;
    });
    rows += `<div class="prow total"><span>${st.term}(${months}개월) 총 납부액</span><span class="v">${won(total)}</span></div>`;
    const notes = [];
    const giftObj = tier && tier.items.find(g => g.code === st.gift);
    rows += `<div class="prow"><span>선택 사은품</span><span class="v">${giftObj ? giftObj.code + ' ' + giftObj.name : (tier ? `<a href="#" id="goGift" class="pick">${tier.code}형 중 선택하기</a>` : '-')}</span></div>`;
    if (card) notes.push(`${card.name} 실적 ${card.tiers[st.perf].perf}↑ 할인 반영`);
    if (unmet) notes.push(`구독료가 ${won(card.tiers[st.perf].minFee)} 이하인 달은 카드 할인 미적용으로 계산`);
    notes.push('설치비 · 등록비 면제 · 계약 종료 후 소유권 이전');
    document.getElementById('pbox').innerHTML = rows + `<div class="pnote">${notes.join(' · ')}</div>`;
    const go = document.getElementById('goGift');
    if (go) go.onclick = e => { e.preventDefault(); document.querySelector('.giftsec').scrollIntoView({ behavior: 'smooth' }); };
    app.querySelectorAll('.glist.sel .gitem').forEach(b => b.classList.toggle('on', b.dataset.g === st.gift));

    const q = new URLSearchParams({ product: p.name, model: p.model, color: st.color, term: st.term, care: st.care });
    if (giftObj) q.set('gift', giftObj.code + ' ' + giftObj.name);
    if (card) { q.set('card', card.name); q.set('cardPerf', '실적 ' + card.tiers[st.perf].perf + '↑'); }
  }
  update();
  window.scrollTo(0, 0);
}

function renderCards() {
  const block = c => `<div class="ccard">
    <div class="chead"><div><h3>${c.name}</h3><div class="cmeta">ARS ${c.ars} · 연회비 ${c.fee}</div></div>
      ${c.promo ? `<span class="cbadge">최대 ${c.extraMonths / 12}년 추가할인</span>` : ''}</div>
    <div class="ctiers">${c.tiers.map(t => `<div class="ctier">
      <div class="cperf">실적 ${t.perf}↑</div>
      <div class="camt ${c.promo && t.extra ? 'hot' : ''}">${won(t.base + t.extra)}</div>
      <div class="csub">${t.extra ? `기본 ${t.base.toLocaleString()} + 추가 ${t.extra.toLocaleString()}` : '기본할인만'}</div></div>`).join('')}</div>
    ${c.notes.length ? `<div class="cnotes">${c.notes.map(n => `<div><span class="tag t-${n[0]}">${n[0]}</span>${n[1]}</div>`).join('')}</div>` : ''}
  </div>`;
  app.innerHTML = `<div class="wrap cards">
    <a class="back" href="#/">← 전체 상품 보기</a>
    <h1>${CARD_PROMO.title}</h1>
    <p class="muted">행사기간 ${CARD_PROMO.period} · 금액은 월 렌탈료 할인 합계(기본할인 또는 캐시백 + 추가할인)</p>
    <div class="common"><b>공통 조건 (모두 충족)</b>${CARD_PROMO.common.map((c, i) => `<div>${'①②③④'[i]} ${c}</div>`).join('')}</div>
    ${CARDS.filter(c => c.promo).map(block).join('')}
    <h2>기본할인만 제공 <small>이번 달 프로모션 미진행</small></h2>
    ${CARDS.filter(c => !c.promo).map(block).join('')}
    <h2>장기할부 24 · 36개월 제휴카드 <small>할부 결제 고객용</small></h2>
    <div class="ccard"><div class="cnotes">
      ${INSTALL.free.map(x => `<div><span class="tag t-무이자">무이자</span><b>${x.name}</b> · ${x.note}</div>`).join('')}
      ${INSTALL.fee.map(x => `<div><span class="tag t-수수료">수수료</span><b>${x.name}</b> · ${x.note}</div>`).join('')}
      <div class="muted" style="margin:6px 0 0">24 · 36개월 할부는 표시된 금액 이상 결제 시 적용</div>
    </div></div>
  </div>`;
  window.scrollTo(0, 0);
}

function route() {
  const m = location.hash.match(/^#\/p\/(\d+)/);
  if (m) renderDetail(parseInt(m[1], 10));
  else if (location.hash === '#/cards') renderCards();
  else renderList();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
